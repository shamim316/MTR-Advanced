name: Build

on:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: pytest tests/ -v

  build-windows:
    name: Windows installer
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Run tests on Windows
        run: |
          pip install pytest
          pytest tests/ -v
      - name: Build single-file EXE (PyInstaller)
        run: pyinstaller AdvancedMTR.spec --noconfirm
      - name: Verify EXE exists
        run: |
          if (-not (Test-Path "dist/AdvancedMTR.exe")) { exit 1 }
          Get-Item dist/AdvancedMTR.exe | Format-List Name, Length
      - name: Install Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
      - name: Build installer (Inno Setup)
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\AdvancedMTR.iss
          Get-ChildItem dist/installer
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v5
        with:
          name: AdvancedMTR-portable-exe
          path: dist/AdvancedMTR.exe
      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: AdvancedMTR-installer
          path: dist/installer/AdvancedMTR-Setup-*.exe

  release:
    name: Attach installer to release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: AdvancedMTR-installer
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: AdvancedMTR-portable-exe
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AdvancedMTR-Setup-*.exe
            dist/AdvancedMTR.exe
          generate_release_notes: true
